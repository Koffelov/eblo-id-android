name: Emulator smoke test

# Manual check on a real Android emulator against the live site, as a guest:
# feed, post, profile, Back, offline screen, external links, Twitch login page inside the app,
# and the system file picker. It never logs in and never posts.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.14.3'
  SYSTEM_IMAGE: 'system-images;android-35;google_apis;x86_64'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Use JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Signing secrets are missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release and debug APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease assembleDebug
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$sdk/sdkmanager" --install emulator "$SYSTEM_IMAGE" > /dev/null
          echo no | "$sdk/avdmanager" create avd --force -n smoke -k "$SYSTEM_IMAGE" -d pixel_6
          mkdir -p smoke-results
          nohup "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none -memory 4096 \
            > smoke-results/emulator.log 2>&1 &
          adb wait-for-device
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell svc power stayon true
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard || true
          sleep 20
          adb shell getprop ro.build.version.release
          adb shell dumpsys package com.google.android.webview | grep -m1 versionName || true

      - name: Run smoke test
        run: |
          pip install --quiet websocket-client
          bash .github/smoke/smoke.sh \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            smoke-results

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: smoke-results
          retention-days: 7
