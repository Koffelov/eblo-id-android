name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Опубликовать GitHub Release с подписанным APK'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_VERSION: '8.14.3'
  # SHA-256 of the permanent release certificate. A release APK signed with any other key
  # (for example a debug key) fails the build, so updates always install over each other.
  RELEASE_CERT_SHA256: 'e203df76294e0157675b63cae0fcddff8c7fb68a53c382bd0c5b62db916eb295'

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.available }}
    steps:
      - uses: actions/checkout@v7

      - name: Use JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="1.0.${GITHUB_RUN_NUMBER}"
          fi
          code=$((100 + GITHUB_RUN_NUMBER))
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version $name (code $code)"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Unit tests (JUnit + Mockito)
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Restore release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured; only the debug APK is built."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify release signature
        if: steps.signing.outputs.available == 'true'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --verbose "$apk"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs"
          actual="$(echo "$certs" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
          if [ "$actual" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::Release APK is signed with an unexpected certificate: $actual"
            exit 1
          fi

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/eblo-id-${VERSION_NAME}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/eblo-id-${VERSION_NAME}.apk"
            (cd dist && sha256sum "eblo-id-${VERSION_NAME}.apk" > "eblo-id-${VERSION_NAME}.apk.sha256")
          fi
          ls -l dist

      - name: Upload debug APK (testing only, not a release)
        uses: actions/upload-artifact@v7
        with:
          name: eblo-id-${{ env.VERSION_NAME }}-debug
          path: dist/eblo-id-${{ env.VERSION_NAME }}-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eblo-id-${{ env.VERSION_NAME }}-release
          path: |
            dist/eblo-id-${{ env.VERSION_NAME }}.apk
            dist/eblo-id-${{ env.VERSION_NAME }}.apk.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require a signed build
        if: needs.build.outputs.signed != 'true'
        run: |
          echo "::error::Release signing secrets are missing; refusing to publish an unsigned or debug APK."
          exit 1

      - uses: actions/download-artifact@v8
        with:
          name: eblo-id-${{ needs.build.outputs.version_name }}-release
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          tag="v${VERSION_NAME}"
          apk="dist/eblo-id-${VERSION_NAME}.apk"
          sha="$(cut -d' ' -f1 "$apk.sha256")"
          cat > notes.md <<EOF
          **Неофициальный клиент eblo.id для Android.** Не связан с eblo.id и его авторами.

          Установка: скачайте \`eblo-id-${VERSION_NAME}.apk\` на телефоне, откройте файл и разрешите установку из этого источника. Новая версия ставится поверх старой, вход сохраняется.

          - Сборка: release, подписана постоянным ключом
          - SHA-256 сертификата: \`${RELEASE_CERT_SHA256}\`
          - SHA-256 APK: \`${sha}\`
          - Коммит: ${GITHUB_SHA}
          EOF
          gh release create "$tag" "$apk" "$apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "eblo.id (неофициальный клиент) $tag" \
            --notes-file notes.md
